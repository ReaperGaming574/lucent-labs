<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lucent Staff</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <div class="admin-layout">

        <!-- ========================================
             SIDEBAR
        ========================================= -->

        <aside class="admin-sidebar">

            <div class="admin-brand">

                <a href="/">
                    LUCENT LABS
                </a>

                <span>
                    STAFF
                </span>

            </div>


            <nav class="admin-nav">

                <a
                    href="index.html"
                    class="admin-nav-link active"
                >
                    <span>01</span>
                    Project Inbox
                </a>

            </nav>


            <div class="admin-sidebar-footer">

                <a href="/">
                    ← Return to Website
                </a>

            </div>

        </aside>


        <!-- ========================================
             MAIN CONTENT
        ========================================= -->

        <main class="admin-main">

            <!-- ========================================
                 HEADER
            ========================================= -->

            <header class="admin-header">

                <div>

                    <p class="admin-eyebrow">
                        LUCENT LABS
                    </p>

                    <h1>
                        Project Inbox
                    </h1>

                </div>


                <div class="admin-status">

                    <span class="status-dot"></span>

                    System Online

                </div>

            </header>


            <!-- ========================================
                 OVERVIEW
            ========================================= -->

            <section class="admin-section">

                <div class="section-heading">

                    <div>

                        <p class="section-number">
                            01 / OVERVIEW
                        </p>

                        <h2>
                            Project Requests
                        </h2>

                    </div>

                </div>


                <div class="stat-grid">

                    <!-- ========================================
                         NEW REQUESTS
                    ========================================= -->

                    <article class="stat-card">

                        <span class="stat-label">
                            New Requests
                        </span>

                        <strong
                            class="stat-value"
                            id="newRequestCount"
                        >
                            —
                        </strong>

                    </article>


                    <!-- ========================================
                         CONTACTED
                    ========================================= -->

                    <article class="stat-card">

                        <span class="stat-label">
                            Contacted
                        </span>

                        <strong
                            class="stat-value"
                            id="contactedCount"
                        >
                            —
                        </strong>

                    </article>


                    <!-- ========================================
                         IN PROGRESS
                    ========================================= -->

                    <article class="stat-card">

                        <span class="stat-label">
                            In Progress
                        </span>

                        <strong
                            class="stat-value"
                            id="inProgressCount"
                        >
                            —
                        </strong>

                    </article>


                    <!-- ========================================
                         CLOSED
                    ========================================= -->

                    <article class="stat-card">

                        <span class="stat-label">
                            Closed
                        </span>

                        <strong
                            class="stat-value"
                            id="closedCount"
                        >
                            —
                        </strong>

                    </article>

                </div>

            </section>


            <!-- ========================================
                 PROJECT INBOX
            ========================================= -->

            <section class="admin-section">

                <div class="section-heading">

                    <div>

                        <p class="section-number">
                            02 / PROJECT INBOX
                        </p>

                        <h2>
                            Recent Project Requests
                        </h2>

                    </div>


                    <div class="inbox-actions">

                        <select
                            id="statusFilter"
                            class="admin-filter"
                            aria-label="Filter project requests"
                        >

                            <option value="all">
                                All Requests
                            </option>

                            <option value="new">
                                New
                            </option>

                            <option value="contacted">
                                Contacted
                            </option>

                            <option value="in_progress">
                                In Progress
                            </option>

                            <option value="closed">
                                Closed
                            </option>

                        </select>


                        <button
                            type="button"
                            class="admin-refresh-button"
                            id="refreshInbox"
                        >
                            Refresh
                        </button>

                    </div>

                </div>


                <!-- ========================================
                     PROJECT REQUEST LIST
                ========================================= -->

                <div
                    class="enquiry-list"
                    id="projectInbox"
                >

                    <div class="admin-loading">

                        <span class="loading-dot"></span>

                        Loading project requests...

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="admin.js"></script>

</body>

</html>
